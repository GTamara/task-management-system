<mat-form-field class="filter-field">
  <mat-label class="filter-label">
    <mat-icon>filter_list</mat-icon>
    {{ label() }}
  </mat-label>
  <mat-select
    [value]="selectedValue()"
    (selectionChange)="onValueSelected($event.value)">
    <mat-select-trigger>
      {{ getSelectedLabel(selectedValue()) }}
    </mat-select-trigger>
    <mat-option>
      <div class="option-with-icon">
        <mat-icon>all_inclusive</mat-icon>
        <span>Все</span>
      </div>
    </mat-option>
    @for (option of statusOptions; track option.order) {
      <mat-option
        [value]="option.value"
        [style.background-color]="option.bgColor"
      >
        <div class="option-with-icon"
          [style.background-color]="option.bgColor"
          [style.color]="option.color"
        >
          <mat-icon>{{ option.icon }}</mat-icon>
          <span>{{ option.label }}</span>
        </div>
      </mat-option>
    }
  </mat-select>
</mat-form-field>
